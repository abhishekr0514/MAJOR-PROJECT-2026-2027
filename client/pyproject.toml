[project]
name = "client"
version = "0.1.0"
description = "MedShield Federated Learning Client"
requires-python = ">=3.11, <4.0"

dependencies = [
    "flwr>=1.32.1",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true